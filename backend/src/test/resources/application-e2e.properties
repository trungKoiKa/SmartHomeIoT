# Profile e2e: broker MQTT that + MySQL rieng (smarthome_e2e). Chi chay khi -De2e=true.
# Mat khau doc tu bien moi truong, khong ghi vao repo.
spring.datasource.url=jdbc:mysql://localhost:3306/smarthome_e2e
spring.datasource.username=${E2E_DB_USER:root}
spring.datasource.password=${E2E_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

mqtt.enabled=true
mqtt.broker.url=${E2E_MQTT_URL:tcp://localhost:1884}
mqtt.client.id=homesmart-e2e-backend
mqtt.username=${E2E_MQTT_BACKEND_USER:homesmart_backend}
mqtt.password=${E2E_MQTT_BACKEND_PASS}
